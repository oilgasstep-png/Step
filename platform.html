<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma STEP</title>
    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        header { background-color: #0066cc; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.4rem; }
        .user-panel { display: flex; align-items: center; gap: 1rem; }
        .btn-logout { background-color: #dc3545; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        .btn-logout:hover { background-color: #c82333; }
        main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

    <header>
        <h1>Plataforma - STEP</h1>
        <div class="user-panel">
            <span id="user-email">Carregando...</span>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>
    </header>

    <main>
        <div class="card">
            <h2>Painel Principal</h2>
            <p>Seja bem-vindo à área logada da plataforma.</p>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://gvdayxbxnzqejqbqkykx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_TeQKj8aLBr7hepq6qhYQ8g_6BvJptk4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function checkAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
            } else {
                document.getElementById('user-email').textContent = session.user.email;
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        checkAuth();
    </script>
</body>
</html>
