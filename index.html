<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Plataforma STEP</title>
    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: #ffffff; padding: 2.5rem; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
        .login-card h2 { text-align: center; color: #333; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; color: #555; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
        .btn { width: 100%; padding: 0.75rem; background-color: #0066cc; color: #fff; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; transition: background 0.2s; }
        .btn:hover { background-color: #0052a3; }
        .btn-secondary { background-color: #6c757d; margin-top: 0.5rem; }
        .btn-secondary:hover { background-color: #5a6268; }
        .msg { margin-top: 1rem; font-size: 0.88rem; text-align: center; color: #d9534f; word-break: break-word; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Entrar no Sistema</h2>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Sua senha" required>
        </div>
        <button class="btn" onclick="login()">Entrar</button>
        <button class="btn btn-secondary" onclick="signUp()">Cadastrar Nova Conta</button>
        <div id="message" class="msg"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gvdayxbxnzqejqbqkykx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_TeQKj8aLBr7hepq6qhYQ8g_6BvJptk4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'platform.html';
            }
        }
        checkSession();

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            msg.textContent = '';

            if(!email || !password) {
                msg.textContent = 'Por favor, preencha todos os campos.';
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                msg.textContent = 'Erro ao entrar: ' + error.message;
            } else {
                window.location.href = 'platform.html';
            }
        }

        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            msg.textContent = '';

            if(!email || !password) {
                msg.textContent = 'Preencha o e-mail e a senha para cadastrar.';
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                msg.textContent = 'Erro ao cadastrar: ' + error.message;
            } else {
                msg.style.color = '#28a745';
                msg.textContent = 'Conta criada com sucesso! Você já pode efetuar o login.';
            }
        }
    </script>
</body>
</html>
</body>
</html>
